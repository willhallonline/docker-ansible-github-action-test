---
# Simple smoke-test playbook for the docker-ansible-github-action.
#
# It runs entirely against localhost (inside the action's container) so no
# managed hosts, SSH keys, or inventory beyond localhost are required. It
# proves that:
#   1. ansible-playbook executed successfully inside the container image.
#   2. Ansible facts can be gathered.
#   3. A basic module (assert) runs and passes.
- name: Verify ansible-playbook runs correctly inside the container
  hosts: local
  gather_facts: true

  tasks:
    - name: Show the Ansible version running inside the container
      ansible.builtin.debug:
        msg: "Ansible {{ ansible_version.full }} on Python {{ ansible_facts.python_version }}"

    - name: Assert that facts were gathered successfully
      ansible.builtin.assert:
        that:
          - ansible_facts.system is defined
          - ansible_version.full is defined
        fail_msg: "Ansible facts were not gathered as expected."
        success_msg: "Ansible facts gathered successfully."

    - name: Ping localhost to confirm connectivity and module execution
      ansible.builtin.ping:
